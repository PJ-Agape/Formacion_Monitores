  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Pastoral Juvenil Ágape · la comunidad en tu bolsillo">
  <meta property="og:locale" content="es_CL">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#1351a4">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Ágape">
  <link rel="preload" href="fonts/fraunces-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/plus-jakarta-sans-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <a class="sr-only" href="#view">Saltar al contenido</a>

  <header class="app-header">
    <div class="inner">
      <a class="brand" href="#/" aria-label="Pastoral Ágape, inicio">
        <img class="brand-mark" src="icons/logo-160.webp" width="40" height="40" alt="">
        <span><span class="brand-name">Pastoral Ágape</span><span class="brand-sub">Comunidad juvenil</span></span>
      </a>
      <nav class="top-nav" id="topNav" aria-label="Principal"></nav>
      <a class="profile-chip" id="profileChip" href="#/perfil"></a>
    </div>
  </header>

  <main id="view" tabindex="-1">
    <div style="display:grid;place-items:center;min-height:50vh;color:var(--ink-3)">Cargando…</div>
  </main>

  <footer class="app-footer">
    <strong>Pastoral Juvenil Ágape</strong><br>
    Construyendo vínculos de amistad en Cristo · <a href="#/ayuda">Ayuda</a> · <a href="#/accesibilidad">Accesibilidad</a> · <a href="familias/">Para las familias</a> · <a href="#/admin">Gestión</a>
  </footer>

  <nav class="bottom-nav" id="bottomNav" aria-label="Principal"></nav>

  <!-- Evaluación de fase -->
  <dialog class="sheet" id="quizDialog" aria-labelledby="quizTitle">
    <div class="sheet-head">
      <div style="flex:1"><span class="eyebrow" data-q-badge></span><h2 id="quizTitle" data-q-title></h2></div>
      <button class="icon-btn" data-action="quizClose" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body"></div>
    <div class="sheet-foot"></div>
  </dialog>

  <!-- Editor del panel de Gestión -->
  <dialog class="sheet" id="editDialog" aria-labelledby="editTitle" style="width:min(720px, calc(100% - 24px))">
    <div class="sheet-head">
      <div style="flex:1"><span class="eyebrow">Editar</span><h2 id="editTitle" data-e-title></h2></div>
      <button class="icon-btn" data-action="eCancel" aria-label="Cerrar">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body"></div>
    <div class="sheet-foot"></div>
  </dialog>

  <div id="toasts" aria-live="polite"></div>
</body>
</html>
