<!DOCTYPE html>
<html lang="es" data-theme="amanecer" data-mode="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Para las familias · Pastoral Juvenil Ágape</title>
  <meta name="description" content="Pastoral Juvenil Ágape, Parroquia San Miguel de Yungay: quiénes somos, próximas actividades, autorizaciones y contacto para las familias.">
  <meta name="theme-color" content="#1351a4">
  <meta property="og:title" content="Pastoral Juvenil Ágape · Para las familias">
  <meta property="og:description" content="Quiénes somos, próximas actividades, autorizaciones y contacto.">
  <meta property="og:image" content="../icons/icon-512.png">
  <link rel="icon" href="../icons/favicon-64.png" type="image/png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
  <link rel="stylesheet" href="../css/app.css">
  <style>
    :root { color-scheme: light; }
    body { background: #fff6e5; color: #0b2566; }
    .fam-top { max-width: 1080px; margin: 0 auto; padding: 18px 20px 0; display: flex; align-items: center; gap: 12px; }
    .fam-top img { width: 46px; height: 46px; }
    .fam-top b { display: block; font-weight: 800; letter-spacing: .02em; }
    .fam-top small { color: #4a5d7a; font-size: .78rem; }
    .fam-top .spacer { flex: 1; }
    main#fam { max-width: 1080px; margin: 0 auto; padding: 10px 20px 40px; display: grid; gap: 22px; }
    .fam-k { display: inline-block; font-size: .72rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; background: #ffba03; color: #0b2566; border: 2.5px solid #0b2566; border-radius: 10px; padding: 5px 10px 4px; box-shadow: 3px 3px 0 #0b2566; rotate: -1.5deg; }
    .fam-k.alt { background: #8ad2fa; }
    .mk { background: linear-gradient(transparent 55%, #ffba03 55%, #ffba03 92%, transparent 92%); padding: 0 .08em; }
    .fam-sec h2, .fam-hero h1 { font-family: var(--font-display); font-weight: 650; letter-spacing: -.02em; line-height: 1.05; margin: 14px 0 10px; }
    .fam-sec h2 { font-size: clamp(1.6rem, 3.4vw, 2.3rem); }
    .fam-hero { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, .8fr); gap: 28px; align-items: center; padding: 28px 0 8px; }
    .fam-hero h1 { font-size: clamp(2.3rem, 6vw, 4.2rem); }
    .fam-hero p { font-size: clamp(1.02rem, 1.6vw, 1.15rem); color: #24406e; max-width: 52ch; line-height: 1.55; }
    .fam-hero-btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
    .fam-hero-ill { background: #8ad2fa; border: 3px solid #0b2566; border-radius: 28px; box-shadow: 8px 8px 0 #0b2566; padding: 10px; rotate: 1.5deg; --il-bg: #fff6e5; }
    .z-illus { width: 100%; height: auto; color: #0b2566; display: block; }
    .fam-sec { background: #fff; border: 3px solid #0b2566; border-radius: 26px; box-shadow: 6px 6px 0 #0b2566; padding: clamp(18px, 3vw, 30px); }
    .fam-sec > p, .fam-lead { color: #24406e; line-height: 1.55; }
    .fam-lead { font-weight: 600; font-size: 1.05rem; }
    .fam-carta { background: #fde9df; }
    .fam-carta-t { font-size: 1.05rem; line-height: 1.6; color: #24406e; max-width: 70ch; }
    .fam-firma { font-family: "Caveat", "Segoe Print", cursive; font-size: 1.6rem; color: #ef591c; margin-top: 10px; }
    .fam-semana, .fam-cuidado { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 300px); gap: 24px; align-items: center; }
    .fam-semana { background: #e1f3fd; --il-bg: #fff; }
    .fam-lema { font-weight: 700; color: #1351a4; margin-bottom: 8px; }
    .fam-semana p { color: #24406e; line-height: 1.55; }
    .fam-mesa { margin-top: 14px; background: #fff; border: 2.5px dashed #0b2566; border-radius: 18px; padding: 14px 16px; line-height: 1.5; color: #24406e; }
    .fam-mesa b { display: block; color: #ef591c; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; margin-bottom: 4px; }
    .fam-evs { display: grid; gap: 12px; margin-top: 8px; }
    .fam-ev { display: flex; gap: 14px; align-items: flex-start; border: 2.5px solid #0b2566; border-radius: 20px; padding: 14px; background: #fffaf0; }
    .fam-date { flex: 0 0 auto; width: 58px; text-align: center; background: #ef591c; color: #fff; border: 2.5px solid #0b2566; border-radius: 14px; padding: 6px 0; box-shadow: 3px 3px 0 #0b2566; }
    .fam-date b { display: block; font-size: 1.5rem; line-height: 1; }
    .fam-date small { text-transform: uppercase; font-weight: 800; font-size: .72rem; letter-spacing: .1em; }
    .fam-ev-main { flex: 1; min-width: 0; }
    .fam-ev-day { display: block; font-size: .82rem; font-weight: 700; color: #1351a4; }
    .fam-ev-day::first-letter { text-transform: uppercase; }
    .fam-ev h3 { font-size: 1.15rem; margin: 2px 0 4px; }
    .fam-ev-where, .fam-ev-desc { color: #4a5d7a; font-size: .92rem; line-height: 1.45; margin-top: 2px; }
    .fam-auth { margin-top: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: #fdf1dc; border-radius: 14px; padding: 10px 12px; font-size: .9rem; }
    .fam-auth span { flex: 1; min-width: 180px; }
    .fam-h3 { margin: 22px 0 8px; font-size: 1rem; }
    .fam-sub { display: flex; gap: 8px; flex-wrap: wrap; }
    .fam-etapas { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 16px; }
    .fam-etapa { border: 2.5px solid #0b2566; border-radius: 20px; padding: 14px 16px; display: grid; gap: 4px; background: #e1f3fd; }
    .fam-etapa.e1 { background: #fff1c7; } .fam-etapa.e2 { background: #fde9df; }
    .fam-etapa b { font-size: 1.15rem; } .fam-etapa i { color: #1351a4; font-weight: 600; } .fam-etapa span { color: #4a5d7a; font-size: .92rem; line-height: 1.45; }
    .fam-cuidado { background: #fffaf0; --il-bg: #fff; }
    .fam-cuidado ul { list-style: none; padding: 0; margin: 6px 0 0; display: grid; gap: 10px; }
    .fam-cuidado li { position: relative; padding-left: 34px; line-height: 1.5; color: #24406e; }
    .fam-cuidado li::before { content: "✓"; position: absolute; left: 0; top: -1px; width: 24px; height: 24px; border-radius: 50%; background: #8ad2fa; border: 2px solid #0b2566; display: grid; place-items: center; font-weight: 800; font-size: .8rem; }
    .fam-honor { background: #fff1c7; }
    .fam-honor ul { list-style: none; padding: 0; margin: 12px 0 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
    .fam-honor li { background: #fff; border: 2px solid #0b2566; border-radius: 14px; padding: 8px 12px; display: grid; }
    .fam-honor li span { font-size: .85rem; color: #4a5d7a; }
    .fam-faq { display: grid; gap: 8px; margin-top: 6px; }
    .fam-faq details { border: 2.5px solid #0b2566; border-radius: 16px; padding: 12px 16px; background: #fffaf0; }
    .fam-faq summary { font-weight: 800; cursor: pointer; }
    .fam-faq p { margin-top: 8px; color: #24406e; line-height: 1.5; }
    .fam-contacto { background: #1351a4; color: #fff6e5; }
    .fam-contacto .fam-lead { color: #fff6e5; }
    .fam-cs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 10px; }
    .fam-c { display: flex; gap: 10px; align-items: center; background: #fff; color: #0b2566; text-decoration: none; border: 2.5px solid #0b2566; border-radius: 16px; padding: 12px 14px; font-size: 1.3rem; box-shadow: 3px 3px 0 #0b2566; }
    .fam-c span { display: grid; font-size: .92rem; } .fam-c b { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: #ef591c; }
    .fam-contacto .muted { color: #cfe2f8; }
    .fam-foot { text-align: center; color: #4a5d7a; font-size: .85rem; padding: 0 20px 40px; }
    .fam-foot a { color: #1351a4; font-weight: 700; }
    @media (max-width: 760px) {
      .fam-hero, .fam-semana, .fam-cuidado { grid-template-columns: 1fr; }
      .fam-hero-ill { max-width: 300px; }
      .fam-semana .z-illus, .fam-cuidado .z-illus { max-width: 240px; }
    }
  </style>
  <script type="module" src="../js/familias.js"></script>
</head>
<body>
  <header class="fam-top">
    <img src="../icons/logo-160.webp" alt="Logo Pastoral Juvenil Ágape" width="46" height="46">
    <span><b>Pastoral Juvenil Ágape</b><small>Parroquia San Miguel de Yungay</small></span>
  </header>
  <main id="fam"><p style="padding:40px 0;color:#4a5d7a">Cargando…</p></main>
  <footer class="fam-foot">Pastoral Juvenil Ágape · Parroquia San Miguel de Yungay · Diócesis San Bartolomé de Chillán<br>
    ¿Eres parte del grupo? <a href="../">Entra a la app de Ágape</a></footer>
</body>
</html>
