# Regenera agenda.ics (calendario para suscribirse) cada hora a partir de la Agenda de Firestore.
name: Calendario Agenda Ágape
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["data/encuentros.json", "scripts/agenda-ics.mjs", "js/repeat.js"]
permissions:
  contents: write
concurrency: { group: agenda-ics, cancel-in-progress: false }
jobs:
  ics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/agenda-ics.mjs agenda.ics
      - name: Publicar si cambió
        run: |
          if [ -n "$(git status --porcelain agenda.ics)" ]; then
            git config user.name "agenda-bot"
            git config user.email "agenda-bot@users.noreply.github.com"
            git add agenda.ics
            git commit -m "Agenda: actualizar calendario"
            git pull --rebase -q origin main
            git push
          fi
